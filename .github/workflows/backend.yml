# Tests the API on every push and pull request. On main it also builds the Docker image, pushes it to
# GitHub's container registry, and rolls it out to Azure Container Apps.
name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
  # Lets you redeploy from the Actions tab (or `gh workflow run backend.yml`) without a new commit.
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/krishatgit/lockedin-api

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest

  image:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  deploy:
    needs: image
    # Skipped until the Azure resources exist and their IDs are saved as repository variables.
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Signs in with a short-lived GitHub token that Azure trusts (OIDC), so no password is stored anywhere.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Roll out the new image
        run: az containerapp update -n lockedin-api -g lockedin-rg --image ${{ env.IMAGE }}:${{ github.sha }}
      - name: Check it's healthy
        run: |
          url="https://$(az containerapp show -n lockedin-api -g lockedin-rg --query properties.configuration.ingress.fqdn -o tsv)"
          # It may be starting from zero replicas and running migrations, so give it a minute.
          for i in $(seq 1 12); do
            if curl -fsS "$url/health"; then echo; echo "Healthy: $url"; exit 0; fi
            sleep 5
          done
          echo "No healthy response from $url/health" && exit 1
